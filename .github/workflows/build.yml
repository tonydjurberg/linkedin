name: Build ProspectHunter

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Syntax check
        run: |
          python -m py_compile app.py

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name ProspectHunter --collect-all playwright app.py

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\ProspectHunter.exe release\ProspectHunter.exe
          Copy-Item START_ProspectHunter.bat release\START_ProspectHunter.bat
          Copy-Item README.md release\README.md
          Compress-Archive -Path release\* -DestinationPath ProspectHunter-Windows.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProspectHunter-Windows
          path: ProspectHunter-Windows.zip
          if-no-files-found: error
